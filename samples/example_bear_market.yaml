name: "Example - Bear Market"
description: "Same starting point as base case, but with pessimistic market returns and slower career growth."

person:
  name: "Sample User"
  birth_year: 1992
  retirement_age: 65

income_sources:
  - name: "Primary Job"
    amount: 55000
    growth_rate: 0.02

assets:
  - name: "Savings Account"
    type: "taxable"
    balance: 5000
    expected_return: 0.03
  - name: "401k"
    type: "401k"
    balance: 15000
    expected_return: 0.04
  - name: "Roth IRA"
    type: "roth_ira"
    balance: 3000
    expected_return: 0.04

expenses:
  - name: "Rent & Utilities"
    amount: 18000
    inflation_adjusted: true
  - name: "Food & Groceries"
    amount: 6000
    inflation_adjusted: true
  - name: "Transportation"
    amount: 5000
    inflation_adjusted: true
  - name: "Healthcare & Insurance"
    amount: 3000
    inflation_adjusted: true
  - name: "Other (entertainment, clothing, etc.)"
    amount: 4000
    inflation_adjusted: true

life_events:
  - name: "Small raise"
    year: 2030
    type: "income_change"
    details:
      source_name: "Primary Job"
      new_amount: 62000
      growth_rate: 0.02
  - name: "First child"
    year: 2028
    type: "child"
    details:
      name: "Child expenses"
      annual_cost: 12000
      end_year: 2046

assumptions:
  inflation_rate: 0.03
  market_return_mean: 0.04
  market_return_stddev: 0.18
  state: "NC"
  state_tax_rate: 0.05
  federal_standard_deduction: 14600
  contribution_401k_limit: 23000
  contribution_ira_limit: 7000
  contribution_hsa_limit: 4150

simulation_years: 30
