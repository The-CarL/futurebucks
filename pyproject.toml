[project]
name = "futurebucks"
version = "0.1.0"
description = "Life-event-driven financial simulation tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "altair>=5.4.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futurebucks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
